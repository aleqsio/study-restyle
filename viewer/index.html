<style>
/* Layout: one-screen editor. The room canvas fills the stage; a paper rail beside it
   (below on phones) has three tabs: Room (whole-room settings), Object (the selected
   piece) and Add (a gallery you drag pieces from). */
:root {
  --bg: #f1eee6;
  --panel: #faf8f3;
  --ink: #2a211b;
  --muted: #6f655c;
  --line: #ddd5c7;
  --accent: #2f6f6a;
  --accent-ink: #ffffff;
  --mustard: #b07f22;
  --stage: #d9d4c8;
  --chip: #ece6da;
  --thumb: #e6e0d4;
  --font-display: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1714; --panel: #231e1a; --ink: #efe7dc; --muted: #a89d90; --line: #3a322b;
    --accent: #5fb0a8; --accent-ink: #10201e; --mustard: #e0ad4a; --stage: #12100e; --chip: #2e2722; --thumb: #2b2520;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1714; --panel: #231e1a; --ink: #efe7dc; --muted: #a89d90; --line: #3a322b;
  --accent: #5fb0a8; --accent-ink: #10201e; --mustard: #e0ad4a; --stage: #12100e; --chip: #2e2722; --thumb: #2b2520;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 430px; grid-template-rows: minmax(0, 1fr); }
.stage { position: relative; min-width: 0; background: var(--stage); }
.stage.dropping { outline: 3px dashed var(--accent); outline-offset: -3px; }
#room { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#room:active { cursor: grabbing; }
.stage-top {
  position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: 12px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none;
}
.stage-top > * { pointer-events: auto; }
.seg { display: flex; flex-wrap: wrap; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 3px; }
.seg button {
  font: 500 12.5px/1 var(--font-body); color: var(--ink); background: transparent; border: 0;
  padding: 7px 12px; border-radius: 999px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.compare {
  font: 500 12.5px/1 var(--font-body); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; user-select: none;
  -webkit-user-select: none; touch-action: none;
}
.compare.on { background: var(--mustard); border-color: var(--mustard); color: #1d150c; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint {
  position: absolute; bottom: 12px; left: max(12px, env(safe-area-inset-left, 0px));
  font: 12px var(--font-body); color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent);
  padding: 6px 10px; border-radius: 6px; max-width: calc(100% - 24px);
}
.piecebar {
  position: absolute; right: 12px; bottom: max(12px, env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 24px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px;
}
.piecebar b { font: 600 13px var(--font-display); padding: 0 6px; }
.piecebar button, .btn {
  font: 500 12.5px/1 var(--font-body); color: var(--ink); background: var(--chip); border: 1px solid var(--line);
  padding: 7px 10px; border-radius: 8px; cursor: pointer;
}
.btn.primary, .piecebar button.done { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.danger { color: #b3412b; }
.btn:disabled { opacity: .45; cursor: default; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 14px var(--font-display); color: var(--muted); letter-spacing: .04em; }

.rail { background: var(--panel); border-left: 1px solid var(--line); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.rail-top { padding-block: 16px 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
h1 { font: 600 22px/1.1 var(--font-display); margin: 0; letter-spacing: .01em; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 9px 12px; background: var(--chip); border-radius: 8px; }
.total span:first-child { font: 500 11px var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.total strong { font: 500 15px var(--font-mono); font-variant-numeric: tabular-nums; }
.share { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.share span { font-size: 12px; color: var(--muted); }
.share input { flex: 1 1 100%; min-width: 0; font: 400 11.5px var(--font-mono); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.inspector { flex: 0 1 auto; max-height: 56%; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--chip) 45%, var(--panel)); }
.library { flex: 1 1 0; }
.insp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.insp-head h2 { font: 600 15px var(--font-display); text-transform: uppercase; letter-spacing: .1em; margin: 0; }
.insp-head span { font-size: 12px; color: var(--muted); }
.colrow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 64px; gap: 8px; align-items: center; padding: 3px 6px; }
.colrow label { font: 500 13px/1.3 var(--font-body); }
.colrow input[type="color"] { width: 44px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
.colrow .price { font: 400 11.5px var(--font-mono); color: var(--muted); text-align: right; }
.colrow .btn { padding: 6px 8px; }
.panel { overflow-y: auto; padding-block: 14px 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; align-content: start; gap: 20px; flex: 1; min-height: 0; }

.block { display: grid; gap: 9px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.block-head h2 { font: 600 13px var(--font-display); text-transform: uppercase; letter-spacing: .1em; margin: 0; }
.block-head span { font-size: 12px; color: var(--muted); }
.note { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.choice {
  display: grid; gap: 6px; text-align: left; padding: 9px 10px; border-radius: 8px; cursor: pointer;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); font: 500 13px/1.25 var(--font-body);
}
.choice:hover { background: var(--chip); }
.choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.choice small { font: 400 11.5px var(--font-mono); color: var(--muted); }
.swatches { display: flex; gap: 3px; }
.swatches i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font: 500 12.5px/1.2 var(--font-body); padding: 6px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
.chip:hover { background: var(--chip); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chip small { font: 400 11px var(--font-mono); opacity: .75; margin-left: 4px; }
.row-label { margin: 2px 0 0; font: 500 11px var(--font-body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; justify-content: space-between; }
.row-label span { text-transform: none; letter-spacing: 0; font-family: var(--font-mono); }
.xlist { display: grid; gap: 2px; }
.xrow { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 2px 8px; padding: 6px 6px; border-radius: 6px; cursor: pointer; align-items: start; }
.xrow:hover { background: var(--chip); }
.xrow input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
.xrow .name { font: 500 13px/1.3 var(--font-body); }
.xrow .price { font: 400 11.5px/1.4 var(--font-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.objlist { display: grid; gap: 2px; }
.objrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; background: none; color: var(--ink); text-align: left; font: inherit; }
.objrow:hover { background: var(--chip); }
.objrow[aria-current="true"] { border-color: var(--accent); }
.objrow img, .objrow .ph { width: 34px; height: 26px; object-fit: cover; border-radius: 4px; background: var(--thumb); }
.objrow .name { font: 500 13px/1.3 var(--font-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.objrow .price { font: 400 11.5px var(--font-mono); color: var(--muted); white-space: nowrap; }
.obj-head { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; }
.obj-head img, .obj-head .ph { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--thumb); }
.obj-head h2 { font: 600 19px/1.15 var(--font-display); margin: 0 0 4px; text-wrap: balance; }
.obj-head p { margin: 0; color: var(--muted); font-size: 12.5px; }
.obj-head strong { font: 500 13px var(--font-mono); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.gallery-cat { display: grid; gap: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.card {
  display: grid; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  cursor: grab; text-align: left; color: var(--ink); font: inherit; user-select: none; -webkit-user-select: none;
}
.card:hover { border-color: var(--accent); }
.card:active { cursor: grabbing; }
.card img, .card .ph { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: var(--thumb); display: block; }
.card .name { font: 500 12.5px/1.25 var(--font-body); }
.card small { font: 400 11px var(--font-mono); color: var(--muted); }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.foot { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58vh auto; height: auto; min-height: 100%; }
  .rail { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .panel { overflow: visible; }
  .inspector, .library { flex: none; max-height: none; } /* stacked: each section takes its content's height */
  .hint { display: none; }
}
</style>

<div class="app">

        <input id="share-url" readonly hidden aria-label="Link to this setup">
      </div>
    </div>
    <section class="panel inspector" id="inspector" aria-label="Settings"></section>
    <div class="panel library" id="library">
      <section class="block" id="objects" aria-label="In the room"></section>
      <section class="block" id="gallery" aria-label="Add pieces"></section>
      <p class="foot">Everything is modelled cheaply from simple shapes, to scale. Prices are rough Polish street prices.</p>
    </div>
  </aside>
</div>

function rotateAbout([x, y], [px, py], rdeg) {

    const t = TPL[o.p];
    if (!t) continue;
    if (o.p === "desk") [o.x, o.y, o.r] = L.desk;
    else if (o.p === "chair") [o.x, o.y, o.r] = L.chair;
    else if (DESK_WALL.has(o.p) && L.wall) {
      [o.x, o.y] = rotateAbout(t.home, [0, 0.80], 180).map((v, i) => v + [L.wall[0], L.wall[1] - 0.80][i]);
      o.r = 180;
    } else if (t.set && L.opp && L.opp[t.set]) {
      let piv = L.opp[t.set];
      if (t.set === "opp:long" && !hasWardrobe) piv = [0.235, 1.03];
      const [rx, ry] = rotateAbout(t.home, t.setPivot, 180);
      [o.x, o.y, o.r] = [rx - t.setPivot[0] + piv[0], ry - t.setPivot[1] + piv[1], 180];

// Turn one of the earlier option sets into a scene of objects
function fromPreset(P, layout = "A") {

  const s = P.slots, x = new Set(P.x || []);

  const add = (p, o, a) => { if (TPL[p]) out.objects.push(inst(p, o, a)); };
  const addTag = (tag) => { for (const p of PROTO_IDS) if (p === tag || p.startsWith(tag + "/")) add(p); };

  if (top === "short") { top = "walnut"; len = "l130"; }
  if (top === "long" && s.wardrobe !== "none") top = "today";
  add("desk", { top, len, lamp: s.desklamp, pc: s.pc }, [...x]);
  add("chair", { model: s.chair }, [...x]);
  if (s.wardrobe !== "none") add("wardrobe", { v: s.wardrobe });
  if (s.shelf !== "none") add("shelves", { v: s.shelf }, [...x]);
  if (s.rug !== "none") add("rug", { v: s.rug });
  if (s.art !== "none") addTag(`art:${s.art}`);
  if (s.wf === "slats" || s.wf === "cork") addTag(`wf:${s.wf}`);
  for (const k of ["corner", "opp", "plant", "between"]) if (s[k] !== LEGACY.slots[k][0]) addTag(`${k}:${s[k]}`);

}

async function renderThumbs() {
  const r2 = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r2.setSize(240, 180);
  r2.outputColorSpace = THREE.SRGBColorSpace;
  r2.toneMapping = THREE.ACESFilmicToneMapping;
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 2.2));
  const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(2, 3, 2); sc.add(dl);
  const cam = new THREE.PerspectiveCamera(30, 4 / 3, 0.01, 50);
  for (const p of PROTO_IDS) {
    if (!TPL[p]) continue;
    const t = TPL[p];
    const node = t.node.clone(true);
    node.position.set(0, 0, 0);
    const o = { p, o: defaultOpts(p), a: new Set(), x: 0, y: 0, z: 0, r: 0, id: -1 };
    if (FAMILIES[p]) { applyInstance(node, o); node.position.set(0, 0, 0); node.rotation.set(0, 0, 0); }
    node.traverse((n) => { if (n.isLight) n.visible = false; });
    sc.add(node);
    const box = new THREE.Box3();
    node.updateWorldMatrix(true, true);
    node.traverseVisible((m) => { if (m.isMesh) box.union(m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld)); });
    const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length() || 1;
    let dir = new THREE.Vector3(1, 0.75, 1);
    if (t.mount === "wall") { const a = deg(FACING_ANGLE[t.facing]); dir = new THREE.Vector3(Math.cos(a), 0.35, -Math.sin(a)); }
    cam.position.copy(c).add(dir.normalize().multiplyScalar(size * 1.55));
    cam.lookAt(c);
    r2.render(sc, cam);
    thumbs[p] = r2.domElement.toDataURL("image/png");
    sc.remove(node);
    document.querySelectorAll(`[data-thumb="${CSS.escape(p)}"]`).forEach((el) => {
      if (el.tagName === "IMG") el.src = thumbs[p];
      else { const i = document.createElement("img"); i.src = thumbs[p]; i.alt = ""; i.className = el.className.replace("ph", "").trim(); i.dataset.thumb = p; el.replaceWith(i); }
    });
    await new Promise((r) => setTimeout(r, 0));
  }

}

  const o = selected && state.objects.find((x) => x.id === selected.id);
  if (!b || !o) return;
  if (b.dataset.rot) { o.r = ((o.r + Number(b.dataset.rot)) % 360 + 540) % 360 - 180; update(); }
  if (b.id === "bar-dup") duplicate(o);
  if (b.id === "bar-del") removeObj(o);
  if (b.id === "bar-done") select(null);
});
window.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && (e.key === "z" || e.key === "Z")) { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if (mod && (e.key === "y" || e.key === "Y")) { e.preventDefault(); return redo(); }
  const o = selected && state.objects.find((x) => x.id === selected.id);
  if (!o) return;
  if (mod && (e.key === "d" || e.key === "D")) { e.preventDefault(); return duplicate(o); }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); return removeObj(o); }
  if (e.key === "Escape") return select(null);
  if (TPL[o.p].mount === "floor" && (e.key === "q" || e.key === "Q")) { o.r -= 15; update(); }
  if (TPL[o.p].mount === "floor" && (e.key === "e" || e.key === "E")) { o.r += 15; update(); }
});

// ================================================================ views
function updateCutaway() {
  const p = camera.position;
  const bx = p.x, by = -p.z, bz = p.y, m = 0.02;
  const hide = { S: by < -m, N: by > D + m, W: bx < -m, E: bx > W + m, C: bz > H - 0.01 };
  for (const o of wallNodes) o.visible = !hide[o.userData.side];
}
const VIEWS = {
  doll: { pos: [W + 2.6, 4.4, 2.4], target: [W / 2, 0.9, -D / 2], fov: 45, three: true },
  photo: { pos: [2.20, 1.45, 1.40], target: [0.0, 1.55, 1.12], hfov: 100 },
  door: { pos: [1.80, 0.55, 1.60], target: [1.85, 2.95, 0.95], hfov: 98 },
  opposite: { pos: [0.95, 1.25, 1.55], target: [W, 0.95, 0.85], hfov: 95 },
  // Eye level in the desk chair, looking at the nearest desk
  seated: () => {
    const ch = state.objects.find((o) => o.p === "chair") || { x: 1.05, y: 0.75 };
    const desks = state.objects.filter((o) => o.p === "desk");
    const dk = desks.sort((a, b) => Math.hypot(a.x - ch.x, a.y - ch.y) - Math.hypot(b.x - ch.x, b.y - ch.y))[0] || { x: 0.35, y: 0.75 };
    const d = Math.hypot(dk.x - ch.x, dk.y - ch.y) || 1, u = [(dk.x - ch.x) / d, (dk.y - ch.y) / d];
    return { pos: [ch.x + u[0] * 0.04, ch.y + u[1] * 0.04, 1.2], target: [dk.x + u[0] * 0.2, dk.y + u[1] * 0.2, 1.02], fov: 62 };
  },
  standing: { pos: [1.45, 1.75, 1.63], target: [0.2, 0.4, 1.30], fov: 62 },
  top: { pos: [W / 2, 8.5, -D / 2 + 0.001], target: [W / 2, 0, -D / 2], fov: 30, three: true },
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function fovFor(v) {
  if (!v.hfov) return v.fov;
  const h = deg(v.hfov) / 2;
  return Math.min(105, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(h) / camera.aspect)));
}
const INSIDE = new Set(["photo", "door", "opposite", "seated", "standing"]);
const hintEl = document.getElementById("hint");
let lookMode = false;
function setLookMode(on) {
  lookMode = on;
  controls.enableZoom = !on;
  controls.enablePan = !on;
  controls.rotateSpeed = on ? -0.35 : 1;
  controls.minDistance = on ? 0.01 : 0.4;
  controls.minPolarAngle = on ? 0.15 : 0;
  controls.maxPolarAngle = on ? Math.PI - 0.15 : Math.PI * 0.49;
  hintEl.textContent = on ? "Drag to look around · scroll to zoom · click a piece to edit it" : "Drag to orbit · scroll to zoom · click a piece to move or edit it";
}
function lookTarget(pos, target) { return pos.clone().add(target.clone().sub(pos).normalize().multiplyScalar(0.05)); }
canvas.addEventListener("wheel", (e) => {
  if (!lookMode) return;
  e.preventDefault();
  camera.fov = THREE.MathUtils.clamp(camera.fov + e.deltaY * 0.04, 25, 105);
  camera.updateProjectionMatrix();
}, { passive: false });
let tween = null, currentView = "doll";
function setView(name, animate = true) {
  currentView = name;
  state.view = name;
  const v = typeof VIEWS[name] === "function" ? VIEWS[name]() : VIEWS[name];
  const inside = INSIDE.has(name);
  document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
  const pos = v.three ? new THREE.Vector3(...v.pos) : toThree(...v.pos);
  const target = v.three ? new THREE.Vector3(...v.target) : toThree(...v.target);
  const to = { pos, target, fov: fovFor(v), inside };
  if (!inside) setLookMode(false);
  if (loaded) renderObjects(comparing ? TODAY_STATE : state);
  persist();
  if (!animate || reduceMotion) {
    camera.position.copy(to.pos); controls.target.copy(inside ? lookTarget(to.pos, to.target) : to.target);
    camera.fov = to.fov; camera.updateProjectionMatrix();
    if (inside) setLookMode(true);
    tween = null; return;
  }
  tween = { from: { pos: camera.position.clone(), target: controls.target.clone(), fov: camera.fov }, to, t0: performance.now(), dur: 700 };
}
document.getElementById("views").addEventListener("click", (e) => { const b = e.target.closest("button[data-view]"); if (b) setView(b.dataset.view); });
document.getElementById("scenes").addEventListener("click", (e) => { const b = e.target.closest("button[data-scene]"); if (b) { state.scene = b.dataset.scene; update(); } });
controls.addEventListener("start", () => {
  if (tween && tween.to.inside) { controls.target.copy(lookTarget(tween.to.pos, tween.to.target)); setLookMode(true); }
  tween = null;
  if (lookMode) return;
  currentView = null;
  document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-pressed", "false"));
});

// Hold to compare with the room as it is today
const cmp = document.getElementById("compare");
const startCmp = (e) => { e.preventDefault(); if (!loaded) return; TODAY_STATE = TODAY_STATE || { ...state, ...fromPreset(PRESETS.today), style: "green" }; comparing = true; cmp.classList.add("on"); selHelper.visible = false; moveGizmo.detach(); turnGizmo.detach(); update(false); };
const endCmp = () => { if (!comparing) return; comparing = false; cmp.classList.remove("on"); update(false); if (selected) { const o = state.objects.find((x) => x.id === selected.id); if (o) select(o); } };
cmp.addEventListener("pointerdown", startCmp);
["pointerup", "pointerleave", "pointercancel"].forEach((ev) => cmp.addEventListener(ev, endCmp));
cmp.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) startCmp(e); });
cmp.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") endCmp(); });

// Copy a link that reopens this exact setup
const ARTIFACT_URL = "https://claude.ai/artifact/BHxgha47mDLkzA654ebKGK";
function shareUrl() {
  // Inside the claude.ai artifact the page runs on a sandbox host, so link to the artifact itself;
  // anywhere else (GitHub Pages, a local server) link to this page.
  const ownHost = /^(localhost|127\.0\.0\.1|\[::1\])$|\.github\.io$/.test(location.hostname) || location.protocol === "file:";
  return (ownHost ? location.href.split("#")[0] : ARTIFACT_URL) + "#" + encode(state);
}
document.getElementById("copy-link").addEventListener("click", async () => {
  const url = shareUrl(), status = document.getElementById("copy-status"), input = document.getElementById("share-url");
  input.value = url;
  try { await navigator.clipboard.writeText(url); status.textContent = "Link copied"; input.hidden = true; }
  catch { status.textContent = "Copy the link below"; input.hidden = false; input.focus(); input.select(); }
});
window.addEventListener("hashchange", () => {
  const tok = location.hash.slice(1);
  if (tok === lastToken || !decode(tok)) return;
  select(null);
  restore(tok);
});

// ================================================================ loop
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
resize();
const ease = (t) => 1 - Math.pow(1 - t, 3);
renderer.setAnimationLoop((now) => {
  if (tween) {
    const t = Math.min(1, (now - tween.t0) / tween.dur), k = ease(t);
    camera.position.lerpVectors(tween.from.pos, tween.to.pos, k);
    controls.target.lerpVectors(tween.from.target, tween.to.target, k);
    camera.fov = tween.from.fov + (tween.to.fov - tween.from.fov) * k;
    camera.updateProjectionMatrix();
    if (t === 1) {
      if (tween.to.inside) { controls.target.copy(lookTarget(tween.to.pos, tween.to.target)); setLookMode(true); }
      tween = null;
    }
  }
  controls.update();
  updateCutaway();
  if (selected) updateSelBox();
  renderer.render(scene, camera);
});
syncPanels();
</script>
